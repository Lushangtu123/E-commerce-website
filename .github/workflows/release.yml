name: 发布

# Production: after CI passes on a main push, migrate → check the schema → deploy without the domain →
# smoke-test that deployment → promote it → verify the domain (rolling back if that fails).
# Pull requests: migrate the preview database (Vercel still builds the preview itself).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One production release at a time and never cancelled midway; previews queue per pull request.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && format('preview-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_CLI: vercel@60.1.3

jobs:
  preview-database:
    name: 预览库迁移
    # Secrets never reach fork or Dependabot pull requests.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    steps:
      - name: 拉取代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: 编译后端
        run: npm ci --prefix backend && npm --prefix backend run build

      - name: 迁移预览库并检查结构
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: 'true'
          DB_SSL_CA_BASE64: ${{ secrets.DB_SSL_CA_BASE64 }}
          LOG_LEVEL: warn
          # Until the preview environment exists the step warns instead of failing every pull request.
          SKIP_IF_UNCONFIGURED: 'true'
        run: bash scripts/ci/release-migrate.sh

  production:
    name: 发布生产
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      issues: write
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://e-commerce-website-blush-rho.vercel.app' }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: 拉取通过 CI 的提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}

      - name: 安装 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: 编译后端
        run: npm ci --prefix backend && npm --prefix backend run build

      - name: 迁移生产库并检查结构
        id: migrate
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: 'true'
          DB_SSL_CA_BASE64: ${{ secrets.DB_SSL_CA_BASE64 }}
          LOG_LEVEL: warn
        run: bash scripts/ci/release-migrate.sh

      - name: 部署新版本（暂不切换生产域名）
        id: deploy
        run: |
          url=$(npx -y "$VERCEL_CLI" deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: 冒烟测试新部署
        id: smoke
        env:
          SITE_URL: ${{ steps.deploy.outputs.url }}
          PROTECTION_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          REPORT_FILE: smoke-report.md
        run: node scripts/ci/uptime-check.mjs

      - name: 切换生产域名
        id: promote
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: npx -y "$VERCEL_CLI" promote "$DEPLOY_URL" --yes --token "$VERCEL_TOKEN"

      - name: 验证生产域名
        id: verify
        env:
          SITE_URL: ${{ env.PRODUCTION_URL }}
          REPORT_FILE: verify-report.md
        run: node scripts/ci/uptime-check.mjs

      - name: 生产验证失败时回滚
        id: rollback
        if: failure() && steps.verify.outcome == 'failure'
        run: npx -y "$VERCEL_CLI" rollback --yes --token "$VERCEL_TOKEN"

      - name: 开启发布失败 Issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          MIGRATE: ${{ steps.migrate.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          PROMOTE: ${{ steps.promote.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
        run: bash scripts/ci/release-issue.sh

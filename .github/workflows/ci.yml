name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede older checks for the same PR; each main push remains independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs only read the repository; artifacts use the runtime token, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  backend:
    name: 后端：编译 + 测试
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASSWORD: order_test_password
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 拉取代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 验证测试服务恢复逻辑
        run: bash ../scripts/ci/test-services.sh

      - name: 启动隔离 MySQL 与 Redis（官方镜像备用源）
        run: bash ../scripts/ci/services.sh start

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 编译
        run: npm run build

      - name: 运行测试
        run: npm test

      - name: 安装浏览器回归测试依赖
        run: npm ci --prefix ../frontend

      - name: 构建浏览器测试的生产前端
        env:
          NEXT_PUBLIC_API_URL: 'http://127.0.0.1:3101/api'
          ECOMMERCE_SERVERLESS_API: 'false'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm --prefix ../frontend run build

      - name: 安装 Chromium
        run: ../frontend/node_modules/.bin/playwright install --with-deps chromium

      - name: 真实 MySQL 浏览器交易流程
        env:
          ECOMMERCE_E2E_PRODUCTION: 'true'
        run: npm --prefix ../frontend run test:e2e

      - name: 保存浏览器验证截图
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: commerce-browser-evidence
          path: frontend/test-results/
          if-no-files-found: ignore

      - name: 清理隔离测试服务
        if: always()
        run: bash ../scripts/ci/services.sh stop

  frontend:
    name: 前端：构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 拉取代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 准备构建环境变量
        run: cp .env.local.example .env.local

      - name: 前端回归测试
        run: npm test

      - name: ESLint 检查
        run: npm run lint

      - name: 构建同域 API 后端
        run: npm ci --prefix ../backend && npm --prefix ../backend run build

      - name: Next.js 构建
        env:
          ECOMMERCE_SERVERLESS_API: 'true'
        run: npm run build

name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端：编译 + 测试
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: order_test_password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -porder_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASSWORD: order_test_password
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 编译
        run: npm run build

      - name: 运行测试
        run: npm test

      - name: 安装浏览器回归测试依赖
        run: npm ci --prefix ../frontend

      - name: 安装 Chromium
        run: ../frontend/node_modules/.bin/playwright install --with-deps chromium

      - name: 真实 MySQL 浏览器交易流程
        run: npm --prefix ../frontend run test:e2e

      - name: 保存浏览器验证截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commerce-browser-evidence
          path: frontend/test-results/
          if-no-files-found: ignore

  frontend:
    name: 前端：构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 准备构建环境变量
        run: cp .env.local.example .env.local

      - name: 前端回归测试
        run: npm test

      - name: 构建同域 API 后端
        run: npm ci --prefix ../backend && npm --prefix ../backend run build

      - name: Next.js 构建
        env:
          ECOMMERCE_SERVERLESS_API: 'true'
        run: npm run build
